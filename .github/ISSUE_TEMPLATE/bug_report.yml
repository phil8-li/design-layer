name: Bug report
description: Something the editor did that it should not have done.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please confirm it against current `main` if you can. If this is a
        security issue, do not file it here — see
        [SECURITY.md](https://github.com/phil8-li/design-layer/blob/main/SECURITY.md).

  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected instead
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Ran `designlayer --dev --open 3000`
        2. Selected the ... element
        3. Dragged the ... control
    validations:
      required: true

  - type: dropdown
    id: outcome
    attributes:
      label: Where did the edit end up?
      description: >
        The editor either writes to source or hands the change to the Changes
        tab. Which one happened narrows this down a lot.
      options:
        - It wrote the wrong thing to source
        - It landed in the Changes tab instead of source
        - Nothing happened at all
        - Not an editing problem
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: DesignLayer version or commit
    validations:
      required: true

  - type: input
    id: env
    attributes:
      label: OS and Node version
      placeholder: macOS 15.3, Node 22.11
    validations:
      required: true

  - type: input
    id: framework
    attributes:
      label: Framework and version
      placeholder: Next 15.1.6 (App Router) / Vite 6 + React 19 / Angular 20
    validations:
      required: true

  - type: dropdown
    id: tailwind
    attributes:
      label: Tailwind version
      options:
        - v4
        - v3
        - No Tailwind
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Launcher output, console errors, a screenshot or a short clip.
