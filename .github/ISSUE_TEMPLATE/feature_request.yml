name: Feature request
description: Something the editor should be able to do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do that you cannot do now?
      description: Describe the situation, not the implementation.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What would you have it do?
    validations:
      required: true

  - type: textarea
    id: workaround
    attributes:
      label: What do you do today instead?
