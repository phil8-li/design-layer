<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Design Layer — launch film (promo cuts)</title>
<meta name="viewport" content="width=1920, height=1080">
<link rel="stylesheet" href="promo.css">
</head>
<body>
<div id="film">
  <div id="bg"></div>
  <div id="stage">
    <div id="glow"></div>
    <div id="world">
      <div id="nodesBack"></div>
      <div id="win">
        <div class="chrome"><span class="dots"><i></i><i></i><i></i></span><span class="url">localhost:3000</span></div>
        <div id="vp">
          <div id="cam">
            <div class="strip" id="stripL"><img alt=""></div>
            <div class="strip" id="stripR"><img alt=""></div>
            <div id="typeMask"></div>
            <div id="caret"></div>
            <div id="spot"></div>
            <div id="ring"></div>
            <div id="cursor"><svg viewBox="0 0 20 26"><path d="M2.5 2v18.2l4.6-4.3 2.9 6.8 3.3-1.4-2.9-6.7H16.6Z" fill="#fff" stroke="#111" stroke-width="1.3" stroke-linejoin="round"/></svg><div class="ctag"></div></div>
          </div>
          <div id="shade"></div>
          <div id="mono"></div>
        </div>
      </div>
      <div id="crops"></div>
      <div class="card" id="term">
        <div class="cardBar"><span class="dots"><i></i><i></i><i></i></span><b>Your coding agent</b><span>· designlayer MCP</span></div>
        <pre id="termText"></pre>
      </div>
      <div class="card" id="code">
        <div class="cardBar"><span id="codeFile"></span></div>
        <div id="codeBody"></div>
      </div>
      <div id="nodesFront"></div>
    </div>
    <div id="flood"></div>
    <div id="callouts"></div>
    <div id="type"></div>
    <div id="nodesTop"></div>
    <div id="keys"></div>
    <div id="logo">
      <img id="logoIcon" src="../../assets/brand/icon-512.png" alt="">
      <div id="logoMark">Design Layer</div>
      <div id="logoSub">Bring the design layer to your vibe-coded apps.</div>
      <div id="logoUrl">github.com/phil8-li/design-layer</div>
    </div>
  </div>
  <div id="black"></div>
</div>
<script type="module" src="promo.js"></script>
</body>
</html>
