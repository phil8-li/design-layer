<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- DesignLayer's tab icon: one indigo layer under the pointer, drawn for 16 and 32 px.
       The Mac app's Dock icon is desktop/mac/icons/app-icon.svg. -->
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1e222d"/><stop offset="1" stop-color="#0c1014"/></linearGradient>
    <linearGradient id="layer" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c8eff"/><stop offset="0.55" stop-color="#4a5df9"/><stop offset="1" stop-color="#3849da"/></linearGradient>
    <linearGradient id="pointer" x1="0" y1="0" x2="0.4" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dce5ff"/></linearGradient>
    <filter id="lift" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="1.4" stdDeviation="1.1" flood-color="#080c3a" flood-opacity="0.78"/></filter>
  </defs>
  <rect width="32" height="32" rx="7" fill="url(#ground)"/>
  <circle cx="16" cy="17" r="11" fill="#4a5df9" opacity="0.34"/>
  <path d="M 16.8 9.2 L 28.8 17.4 L 15.2 25.2 L 3.2 17.0 Z" fill="#2b3ab8" stroke="#2b3ab8" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M 16.8 7.4 L 28.8 15.6 L 15.2 23.4 L 3.2 15.2 Z" fill="url(#layer)" stroke="url(#layer)" stroke-width="2.4" stroke-linejoin="round"/>
  <g transform="translate(15.0 15.6) rotate(-40) scale(1.08)" filter="url(#lift)">
    <path d="M 0.35 0 C 0.12 -0.28, 0.99 -0.54, 1.41 -0.63 Q 9.71 -4.02, 17.78 -7.93 C 19.13 -8.53, 19.32 -8.31, 18.55 -7.05 L 15.11 -1.44 C 14.49 -0.43, 14.45 -0.17, 14.45 0 C 14.45 0.17, 14.49 0.43, 15.11 1.44 L 18.55 7.05 C 19.32 8.31, 19.13 8.53, 17.78 7.93 Q 9.71 4.02, 1.41 0.63 C 0.99 0.54, 0.12 0.28, 0.35 0 Z" fill="url(#pointer)"/>
